{% macro icon(name, class="h-5 w-5") %}
<svg class="{{ class }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == "menu" %}
    <path d="M4 6h16M4 12h16M4 18h16"/>
  {% elif name == "close" %}
    <path d="M18 6 6 18M6 6l12 12"/>
  {% elif name == "dashboard" %}
    <rect width="7" height="9" x="3" y="3" rx="1"/>
    <rect width="7" height="5" x="14" y="3" rx="1"/>
    <rect width="7" height="9" x="14" y="12" rx="1"/>
    <rect width="7" height="5" x="3" y="16" rx="1"/>
  {% elif name == "user" %}
    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
    <circle cx="12" cy="7" r="4"/>
  {% elif name == "history" %}
    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
    <path d="M3 3v5h5"/>
    <path d="M12 7v5l4 2"/>
  {% elif name == "file" %}
    <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
    <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
    <path d="m9 15 2 2 4-4"/>
  {% elif name == "users" %}
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
    <circle cx="9" cy="7" r="4"/>
    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  {% elif name == "clipboard" %}
    <rect width="8" height="4" x="8" y="2" rx="1"/>
    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
    <path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/>
  {% elif name == "login" %}
    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
    <path d="m10 17 5-5-5-5"/>
    <path d="M15 12H3"/>
  {% elif name == "bell" %}
    <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
    <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
  {% elif name == "chevron" %}
    <path d="m9 18 6-6-6-6"/>
  {% elif name == "home" %}
    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    <path d="M9 22V12h6v10"/>
  {% elif name == "megaphone" %}
    <path d="m3 11 18-5v12L3 13v-2z"/>
    <path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>
  {% elif name == "download" %}
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <path d="m7 10 5 5 5-5"/>
    <path d="M12 15V3"/>
  {% elif name == "check" %}
    <circle cx="12" cy="12" r="10"/>
    <path d="m9 12 2 2 4-4"/>
  {% elif name == "clock" %}
    <circle cx="12" cy="12" r="10"/>
    <path d="M12 6v6l4 2"/>
  {% elif name == "calendar" %}
    <rect width="18" height="18" x="3" y="4" rx="2"/>
    <path d="M16 2v4M8 2v4M3 10h18"/>
  {% elif name == "list" %}
    <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
  {% elif name == "mail" %}
    <rect width="20" height="16" x="2" y="4" rx="2"/>
    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
  {% elif name == "lock" %}
    <rect width="18" height="11" x="3" y="11" rx="2"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  {% elif name == "eye" %}
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
    <circle cx="12" cy="12" r="3"/>
  {% elif name == "eye-off" %}
    <path d="M9.88 9.88a3 3 0 0 0 4.24 4.24"/>
    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
    <path d="M2 2l20 20"/>
  {% elif name == "library" %}
    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
  {% elif name == "accounting" %}
    <rect width="20" height="14" x="2" y="5" rx="2"/>
    <path d="M2 10h20"/>
  {% endif %}
</svg>
{% endmacro %}

{% macro seal(class="h-10 w-10") %}
<span class="{{ class }} inline-flex shrink-0 items-center justify-center overflow-hidden rounded-full bg-white p-0.5">
  <img class="h-full w-full object-contain" src="{{ url_for('static', filename='img/dnsc-logo.jpg') }}" alt="Davao del Norte State College seal">
</span>
{% endmacro %}
