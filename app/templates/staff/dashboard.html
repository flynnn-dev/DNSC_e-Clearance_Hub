{% extends "staff/shell.html" %}

{% block title %}Staff office · DNSC e-Clearance Hub{% endblock %}

{% block content %}
  <h1 class="text-2xl font-semibold tracking-tight text-green-900 sm:text-3xl">Office clearance</h1>
  <p class="mt-1 text-sm text-slate-600">{{ current_user.office|capitalize }} staff</p>
  <p id="office-alert" class="mt-4 hidden rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900" role="status"></p>

  <section class="mt-6 grid gap-4 sm:grid-cols-3">
    <a class="card" href="{{ url_for('ui.staff_students', status='HOLD') }}">
      <h2 class="text-sm font-medium text-slate-500">On hold</h2>
      <p id="count-hold" class="mt-3 text-4xl font-semibold tracking-tight text-green-900">—</p>
    </a>
    <a class="card" href="{{ url_for('ui.staff_students', status='PENDING') }}">
      <h2 class="text-sm font-medium text-slate-500">Pending</h2>
      <p id="count-pending" class="mt-3 text-4xl font-semibold tracking-tight text-green-900">—</p>
    </a>
    <a class="card" href="{{ url_for('ui.staff_students', status='CLEARED') }}">
      <h2 class="text-sm font-medium text-slate-500">Cleared</h2>
      <p id="count-cleared" class="mt-3 text-4xl font-semibold tracking-tight text-green-900">—</p>
    </a>
  </section>
{% endblock %}
