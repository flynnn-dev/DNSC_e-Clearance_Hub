{% extends "staff/shell.html" %}

{% block title %}Documents · DNSC e-Clearance Hub{% endblock %}

{% block content %}
  <section class="card">
    <h1 class="text-2xl font-semibold tracking-tight text-green-900">Documents</h1>
    <p class="mt-1 text-sm text-slate-600">Download this office's clearance report. Student numbers are masked.</p>
    <div class="mt-6 flex flex-wrap gap-2">
      <a class="btn btn-primary" href="{{ url_for('reports_api.report_csv') }}">Download CSV</a>
      <a class="btn btn-secondary" href="{{ url_for('reports_api.report_json') }}">Download JSON</a>
    </div>
  </section>
{% endblock %}
